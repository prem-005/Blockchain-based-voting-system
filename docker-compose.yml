version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/db.sqlite3:/app/db.sqlite3
      - ./backend/media:/app/media
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-lightvote-prod-secret-replace-in-env}
      - DJANGO_ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:5173,http://localhost:80
      - CSRF_TRUSTED_ORIGINS=http://localhost,http://localhost:5173,http://localhost:80
      - HARDHAT_RPC_URL=${HARDHAT_RPC_URL:-http://127.0.0.1:8545}
      - CHAIN_ID=${CHAIN_ID:-31337}
      - BALLOT_NULLIFIER_SECRET=${BALLOT_NULLIFIER_SECRET:-nullifier-secret-replace-in-env}
      - EMAIL_BACKEND_TYPE=console

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_RPC_URL: ${VITE_RPC_URL:-http://127.0.0.1:8545}
        VITE_CHAIN_ID: ${VITE_CHAIN_ID:-31337}
        VITE_CHAIN_NAME: ${VITE_CHAIN_NAME:-LightVote Chain}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
